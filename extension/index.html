<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Cookie Sync</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sen" type="text/css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/images/icon128.png" alt="logo">
            <span class="title">YouTube Cookie Sync</span>
        </div>
        <hr>
        <form class="login-form">
            <label for="endpoint-url">Endpoint URL:</label>
            <input type="text" id="endpoint-url" name="endpoint-url" placeholder="http://localhost:8080">
            <label for="psk">Pre-Shared Key:</label>
            <input type="password" id="psk" name="psk">
        </form>
        <div class="submit">
            <button id="save-config">Save</button>
            <button id="generate-psk">Generate PSK</button>
        </div>
        <div id="error-out"></div>
        <hr>
        <div class="options">
            <div class="sync-status">
                <span>Last sync: </span><span id="sync-status">—</span>
            </div>
            <div id="sync-error" class="sync-error"></div>
            <div>
                <input type="checkbox" id="continuous-sync" name="continuous-sync">
                <span>Continuous Sync</span>
            </div>
            <div class="buttons">
                <button id="sendCookies">Sync Now</button>
                <button id="showCookies">Show Cookies</button>
            </div>
            <textarea id="cookieLinesResponse" readonly></textarea>
        </div>
        <hr>
        <div class="icons">
            <a href="https://github.com/tubearchivist/browser-extension/" target="_blank">
                <img src="/images/social/github.svg" alt="github-icon">
            </a>
        </div>
    </div>
    <script type="text/javascript" src="popup.js"></script>
</body>
</html>
