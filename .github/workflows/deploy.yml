name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'service/**'
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: >-
    deploy-${{
      github.event_name == 'release' && github.event.release.tag_name ||
      github.event_name == 'workflow_dispatch' && 'manual' ||
      'push-main'
    }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/youtube-cookie-sync

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy-service:
    name: build and push docker image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        run: |
          IMAGE_LC=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            echo "tags=${IMAGE_LC}:${VERSION},${IMAGE_LC}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMAGE_LC}:edge" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-extension:
    name: release extension
    needs: ci
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zips
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p release
          cd extension

          cp manifest-firefox.json manifest.json
          zip -rq ../release/cookie-sync-${VERSION}-firefox.zip . \
            -x manifest-chrome.json -x manifest-firefox.json \
            -x "node_modules/*" -x package.json -x package-lock.json \
            -x eslint.config.js -x deploy.sh -x "__tests__/*"
          rm manifest.json

          cp manifest-chrome.json manifest.json
          zip -rq ../release/cookie-sync-${VERSION}-chrome.zip . \
            -x manifest-chrome.json -x manifest-firefox.json \
            -x "node_modules/*" -x package.json -x package-lock.json \
            -x eslint.config.js -x deploy.sh -x "__tests__/*"
          rm manifest.json

      - name: Upload zips to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          gh release upload "$VERSION" \
            release/cookie-sync-${VERSION}-firefox.zip \
            release/cookie-sync-${VERSION}-chrome.zip

      - name: Publish to Chrome Web Store
        uses: fregante/chrome-webstore-upload-action@v2
        with:
          file-name: release/cookie-sync-${{ github.event.release.tag_name }}-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Firefox Add-ons
        uses: trmcnvn/firefox-addon@v1
        with:
          uuid: ${{ secrets.AMO_EXTENSION_UUID }}
          xpi: release/cookie-sync-${{ github.event.release.tag_name }}-firefox.zip
          manifest: extension/manifest-firefox.json
          api-key: ${{ secrets.AMO_JWT_ISSUER }}
          api-secret: ${{ secrets.AMO_JWT_SECRET }}